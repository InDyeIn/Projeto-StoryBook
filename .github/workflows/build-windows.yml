name: Gerar StoryBook.exe

# O PyInstaller não faz compilação cruzada: o executável do Windows precisa ser
# gerado no Windows. Este workflow faz isso a cada push e deixa o .exe pronto
# para baixar em Actions → a execução → Artifacts.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Conferir que a aplicação sobe antes de empacotar
        run: python -c "from app.main import app; print('app importa:', app.title)"

      - name: Rodar os testes
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests -q

      - name: Empacotar
        run: pyinstaller storybook.spec --noconfirm

      - name: Conferir que o executável responde
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\StoryBook.exe" `
                                -ArgumentList "--navegador","--porta","8765" `
                                -PassThru
          try {
            $ok = $false
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/saude" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "O executável não respondeu em 40 segundos." }
            Write-Host "Executável respondeu: OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: StoryBook-windows
          path: dist/StoryBook.exe
          retention-days: 30

      # Quando você criar uma tag (git tag v0.1.0 && git push --tags),
      # o executável também vira um release para baixar direto.
      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StoryBook.exe
          generate_release_notes: true
