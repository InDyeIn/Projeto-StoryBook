{% extends "base.html" %}

{% block head %}
<style>
  .auth-wrap {
    min-height: calc(100vh - var(--nav-h));
    display: grid;
    place-items: center;
    padding: 2.5rem 1.25rem 4rem;
  }
  .auth-card { width: min(440px, 100%); padding: clamp(1.6rem, 5vw, 2.4rem); }
  .auth-card h1 { font-size: 1.75rem; margin-bottom: .25em; }
  .auth-foot { margin-top: 1.5rem; text-align: center; font-size: .88rem; color: var(--ink-mute); }
  .auth-aside {
    margin-top: 1.5rem;
    padding: .9rem 1rem;
    border-radius: var(--r);
    border: 1px solid var(--line-soft);
    background: rgba(255,255,255,.02);
    font-size: .82rem;
    color: var(--ink-mute);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    {% block form %}{% endblock %}
  </div>
</div>
{% endblock %}
